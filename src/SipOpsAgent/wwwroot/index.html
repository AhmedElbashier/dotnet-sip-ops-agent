<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sip-ops-agent</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2330;
      --ink: #e7ecf3;
      --muted: #9aa8b8;
      --accent: #5b8def;
      --ok: #3dbe7a;
      --warn: #e0a435;
      --line: #2a3646;
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 var(--sans);
    }
    header, main { max-width: 960px; margin: 0 auto; padding: 0 1.25rem; }
    header { padding-top: 2rem; }
    h1 { font-size: 1.4rem; font-weight: 650; margin: 0 0 .35rem; }
    .sub { color: var(--muted); margin: 0 0 1.25rem; }
    .row { display: flex; gap: .6rem; }
    textarea {
      flex: 1;
      min-height: 5.5rem;
      resize: vertical;
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: .75rem;
      font: 15px/1.45 var(--sans);
    }
    button {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 0 .95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .hints { display: flex; flex-wrap: wrap; gap: .4rem; margin: .75rem 0 1.25rem; }
    .hints button {
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
      font-weight: 500;
      font-size: .82rem;
      padding: .3rem .6rem;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      margin-bottom: 1rem;
    }
    h2 { font-size: .9rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 .6rem; }
    pre, .answer {
      white-space: pre-wrap;
      word-break: break-word;
      font-family: var(--mono);
      font-size: .82rem;
      margin: 0;
    }
    .answer { font-family: var(--sans); font-size: .98rem; }
    .turn { border-top: 1px solid var(--line); padding: .7rem 0; }
    .turn:first-child { border-top: 0; padding-top: 0; }
    .badge {
      display: inline-block;
      font-size: .75rem;
      padding: .05rem .4rem;
      border-radius: 999px;
      background: #243044;
      color: var(--muted);
      margin-right: .35rem;
    }
    .badge.ok { color: var(--ok); }
    .meta { color: var(--muted); font-size: .85rem; margin-bottom: .5rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>sip-ops-agent</h1>
    <p class="sub">Ask a question about the sample SIP/CDR logs. The default provider is a deterministic scripted planner for the no-key quickstart; point <code>Llm:Provider</code> at <code>openai</code> to use OpenAI, Azure or Ollama.</p>
  </header>
  <main>
    <div class="row">
      <textarea id="q" placeholder="Why did calls fail on trunk-du-backup this morning?">Why did calls fail on trunk-du-backup this morning?</textarea>
      <button id="go" type="button">Ask</button>
    </div>
    <div class="hints">
      <button type="button" data-q="Why did calls fail on trunk-du-backup this morning?">503 incident</button>
      <button type="button" data-q="How many 486 busy calls were there, and post a warning webhook.">Busy + webhook</button>
      <button type="button" data-q="Get details for call cdr-20261124-0042">Featured call</button>
      <button type="button" data-q="What happened on cdr-20261124-0018?">Poor MOS</button>
    </div>
    <section>
      <h2>Answer</h2>
      <div class="meta" id="meta">Ready.</div>
      <div class="answer" id="answer"></div>
    </section>
    <section>
      <h2>Tool trace</h2>
      <div id="trace"></div>
    </section>
  </main>
  <script>
    const q = document.getElementById("q");
    const go = document.getElementById("go");
    const answer = document.getElementById("answer");
    const trace = document.getElementById("trace");
    const meta = document.getElementById("meta");

    document.querySelectorAll(".hints button").forEach(b => {
      b.addEventListener("click", () => { q.value = b.dataset.q; });
    });

    async function ask() {
      go.disabled = true;
      meta.textContent = "Running…";
      answer.textContent = "";
      trace.textContent = "";
      try {
        const res = await fetch("/api/agent/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q.value })
        });
        const body = await res.json();
        if (!res.ok) {
          meta.textContent = "Error " + res.status;
          answer.textContent = JSON.stringify(body, null, 2);
          return;
        }
        meta.textContent = `${body.provider} / ${body.model} · ${body.turns} turn(s)` + (body.reachedTurnLimit ? " · turn limit reached" : "");
        answer.textContent = body.answer;
        trace.innerHTML = (body.trace || []).map(t => {
          const calls = (t.toolCalls || []).map(c => {
            return `<div class="turn"><span class="badge ok">${escapeHtml(c.name)}</span><pre>${escapeHtml(c.arguments)}

${escapeHtml(c.result)}</pre></div>`;
          }).join("");
          return `<div class="turn"><span class="badge">turn ${t.turn}</span>${calls || "<div>Final answer, no tools.</div>"}</div>`;
        }).join("") || "<div class='meta'>No trace.</div>";
      } catch (err) {
        meta.textContent = "Request failed";
        answer.textContent = String(err);
      } finally {
        go.disabled = false;
      }
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    go.addEventListener("click", ask);
    q.addEventListener("keydown", ev => {
      if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) ask();
    });
  </script>
</body>
</html>
